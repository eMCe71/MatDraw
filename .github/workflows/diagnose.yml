name: Diagnostyka 403 (tymczasowa)

on:
  push:
    branches: ['claude/admiring-gauss-torrum']
    paths: ['.github/workflows/diagnose.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Połączenie SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh-setup.sh
      - name: Plik .htaccess hostingu w katalogu domowym
        run: ssh deploy 'stat -c "%a %U:%G, %s B, zmieniony %y" "$HOME/.htaccess"; ls -la --time-style=full-iso "$HOME/domains" | grep -v "^total"' || true
      - name: Odpowiedzi domen na tym serwerze
        run: |
          for h in matbravo.com matdraw.mdcse.com test429.mdcse.com mdcse.com gogo.doclert.com; do
            for s in http https; do printf '  %-40s %s\n' "$s://$h/" "$(curl -sk -o /dev/null --max-time 15 -w '%{http_code} %{size_download}B %{redirect_url}' "$s://$h/")"; done
          done
