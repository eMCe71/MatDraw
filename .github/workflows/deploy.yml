name: Test, build i deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Przywróć poprzednie wydanie (bez testów i builda)'
        type: boolean
        default: false
      server_check:
        description: 'Tylko sprawdź połączenie SSH i serwer (bez zmian)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_URL: https://matdraw.mdcse.com
  # Releases and config live outside the DirectAdmin domain directory; the active release is copied into DOCROOT.
  DEPLOY_BASE: /home/meducase/matdraw
  DOCROOT: /home/meducase/domains/matdraw.mdcse.com/public_html

jobs:
  test:
    name: Testy JS i PHP
    if: ${{ !inputs.rollback && !inputs.server_check }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Składnia JS
        run: |
          node --check dist/app.js
          node --check dist/client.js
      - name: Składnia PHP
        run: find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testy reguł i workspace
        run: node --test tests/engine.test.mjs tests/workspace.test.mjs
      - name: Testy PHP (zgodność z JS)
        run: PHP_BIN="$(command -v php)" node --test tests/php.test.mjs

  http-test:
    name: Test HTTP na jednorazowej bazie (${{ matrix.db }})
    if: ${{ !inputs.rollback && !inputs.server_check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # mariadb:10.6 matches the production server (web9.aftermarket.hosting).
        db: ['mysql:8.0', 'mariadb:10.6']
    services:
      mysql:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: matdraw_test
          MYSQL_USER: matdraw
          MYSQL_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Build wydania
        run: node scripts/build-php.mjs ./build/matdraw-php
      - name: Konfiguracja testowa (tylko CI, poza wydaniem)
        run: |
          cat > "$RUNNER_TEMP/matdraw-test-config.php" <<PHP
          <?php
          return [
           'app_url' => 'http://127.0.0.1:8080',
           'db' => ['dsn' => 'mysql:host=127.0.0.1;port=3306;dbname=matdraw_test;charset=utf8mb4', 'user' => 'matdraw', 'password' => 'ci-only-password'],
           'app_key' => '$(openssl rand -hex 32)',
           'allow_insecure_http' => true,
           'session_idle_seconds' => 1800,
           'session_max_seconds' => 43200,
          ];
          PHP
          echo "MATDRAW_CONFIG=$RUNNER_TEMP/matdraw-test-config.php" >> "$GITHUB_ENV"
      - name: Instalacja schematu i konta testowego
        run: printf '%s\n' 'AdminForTests2026!' | php build/matdraw-php/backend/bin/install.php --email=admin@test.example --club='Test Warszawa' --password-stdin
      - name: Test HTTP
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t build/matdraw-php/public > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS 'http://127.0.0.1:8080/api/index.php?route=session' >/dev/null && break; sleep 1; done
          MATDRAW_TEST_URL='http://127.0.0.1:8080/api/index.php' node --test tests/http.test.mjs
      - name: Log serwera PHP
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log"

  build:
    name: Build wydania
    needs: [test, http-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build-php.mjs ./build/matdraw-php
      - name: Kontrola wydania
        run: |
          test "$(cat build/matdraw-php/public/runtime-config.js)" = "export const CONFIG={mode:'api',apiBase:'./api/index.php'};"
          test -f build/matdraw-php/public/.htaccess
          test -f build/matdraw-php/backend/.htaccess
          test ! -e build/matdraw-php/backend/config.php
          test ! -e build/matdraw-php/backend/public
      - uses: actions/upload-artifact@v4
        with:
          name: matdraw-php-${{ github.sha }}
          path: build/matdraw-php
          include-hidden-files: true
          retention-days: 90

  deploy:
    name: Deploy na produkcję
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://matdraw.mdcse.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matdraw-php-${{ github.sha }}
          path: build/matdraw-php
      - name: Połączenie SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh-setup.sh
      - name: Sprawdzenie serwera
        run: |
          ssh deploy bash -s -- check "$DEPLOY_BASE" "$DOCROOT" < scripts/deploy-remote.sh
          echo "PREVIOUS=$(ssh deploy "readlink '$DEPLOY_BASE/current' || true")" >> "$GITHUB_ENV"
      - name: Wysłanie wydania
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          tar -C build/matdraw-php -czf - public backend | ssh deploy "umask 022 && mkdir -p '$DEPLOY_BASE/releases/$RELEASE' && tar -xzf - -C '$DEPLOY_BASE/releases/$RELEASE'"
          ssh deploy "umask 022 && mkdir -p '$DEPLOY_BASE/bin' && cat > '$DEPLOY_BASE/bin/deploy-remote.sh'" < scripts/deploy-remote.sh
      - name: Przełączenie na nowe wydanie
        run: ssh deploy bash -s -- activate "$DEPLOY_BASE" "$DOCROOT" "$RELEASE" < scripts/deploy-remote.sh
      - name: Weryfikacja HTTPS, strony i API
        id: verify
        run: |
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 "$APP_URL/" | grep -q '<title>MatDraw'
          curl -fsS "$APP_URL/runtime-config.js" | grep -q "mode:'api'"
          code=$(curl -sS -o api.json -w '%{http_code}' "$APP_URL/api/index.php?route=session")
          if [ "$code" = 200 ] && grep -q '"csrf"' api.json; then echo "API odpowiada poprawnie (200)."; exit 0; fi
          if [ -z "$PREVIOUS" ]; then
            echo "::warning::Pierwsze wdrożenie: strona działa, API zwraca $code. Uruchom jednorazowo instalator bazy (DEPLOY-PL.md, krok 6) i uruchom workflow ponownie."
            exit 0
          fi
          echo "::error::API zwraca $code: $(cat api.json)"; exit 1
      - name: Powrót do poprzedniego wydania po nieudanej weryfikacji
        if: failure() && steps.verify.outcome == 'failure' && env.PREVIOUS != ''
        run: ssh deploy bash -s -- rollback "$DEPLOY_BASE" "$DOCROOT" < scripts/deploy-remote.sh
      - name: Usunięcie starych wydań
        run: ssh deploy bash -s -- cleanup "$DEPLOY_BASE" "$DOCROOT" < scripts/deploy-remote.sh

  server-check:
    name: Sprawdzenie połączenia z serwerem (tylko odczyt)
    if: inputs.server_check || contains(github.event.head_commit.message, '[server-check]')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Połączenie SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh-setup.sh
      - name: Stan serwera
        run: |
          ssh deploy "DEPLOY_BASE='$DEPLOY_BASE' DOCROOT='$DOCROOT' bash -s" <<'SH'
          echo "Użytkownik: $(whoami)"
          echo "PHP CLI: $(php -r 'echo PHP_VERSION;' 2>&1) ($(command -v php))"
          for p in /usr/local/php8*/bin/php; do [ -x "$p" ] && echo "  $p: $("$p" -r 'echo PHP_VERSION;')"; done
          echo "Rozszerzenia PHP CLI: $(php -m 2>/dev/null | grep -ixE 'pdo_mysql|mbstring' | tr '\n' ' ')"
          echo "tar: $(command -v tar || echo BRAK)"
          echo "Katalog domeny:"; ls -la "$(dirname "$DOCROOT")"
          for x in "$DOCROOT" "$(dirname "$DOCROOT")/private_html"; do echo "$x: $(stat -c '%F' "$x" 2>/dev/null || echo brak) $(readlink "$x")"; done
          [ -f "$DEPLOY_BASE/shared/config.php" ] && echo "config.php: jest" || echo "config.php: BRAK (krok 4)"
          echo "Aktywne wydanie: $(readlink "$DEPLOY_BASE/current" 2>/dev/null || echo brak)"
          SH

  rollback:
    name: Powrót do poprzedniego wydania
    if: inputs.rollback && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://matdraw.mdcse.com
    steps:
      - uses: actions/checkout@v4
      - name: Połączenie SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh-setup.sh
      - name: Przywrócenie
        run: ssh deploy bash -s -- rollback "$DEPLOY_BASE" "$DOCROOT" < scripts/deploy-remote.sh
      - name: Weryfikacja
        run: curl -fsS "$APP_URL/api/index.php?route=session" | grep -q '"csrf"'
